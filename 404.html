<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GearGang</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages - SPA Routing Handler
    // MIT License - https://github.com/rafgraph/spa-github-pages
    (function(l) {
      // This script runs when a 404 is encountered
      if (l.pathname.includes('/GG/')) {
        if (l.search[1] === '/') {
          // If we already have a redirect pattern in the search params, process it
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        } else {
          // Otherwise, create a redirect pattern for SPA routing
          var pathSegmentsToKeep = 1; // Keep the /GG/ segment
          l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
          );
        }
      } else {
        // If outside the /GG/ path, redirect to the app root
        window.location.href = '/GG/';
      }
    }(window.location));
  </script>
</head>
<body>
  <!-- This page is only used for SPA routing in GitHub Pages -->
  <!-- The content is not visible to users as the script runs immediately -->
</body>
</html>
